name: CI y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Configúralas en Settings → Secrets and variables → Actions → Variables
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SPREADSHEET_ID: ${{ vars.VITE_SPREADSHEET_ID }}
          VITE_ALLOWED_EMAILS: ${{ vars.VITE_ALLOWED_EMAILS }}
          VITE_CLINIC_NAME: ${{ vars.VITE_CLINIC_NAME }}
          VITE_CLINIC_ADDRESS: ${{ vars.VITE_CLINIC_ADDRESS }}
          VITE_CLINIC_PHONE: ${{ vars.VITE_CLINIC_PHONE }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
